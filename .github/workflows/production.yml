name: TriLink Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trilink-production-ci
  cancel-in-progress: false

jobs:
  build:
    name: Build and Verify TriLink
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify OpenNext
        run: npx opennextjs-cloudflare --version

      - name: Verify Wrangler
        run: npx wrangler --version

      - name: Build
        run: npm run build

      - name: Verify production output
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
          echo "TriLink production build verified."

      - name: Verify live Vercel production
        run: |
          set -e
          URL="https://trilink.online"

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "$URL/api/system/health"

          echo

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "$URL/api/health/database"

          echo
          echo "Vercel production verification passed."
